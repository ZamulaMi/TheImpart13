      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Impart",
        "alternateName": "TheImpart",
        "url": "https://www.theimpart.com/",

        "publisher": {
          "@type": "Organization",
          "name": "The Impart",
          "alternateName": "TheImpart",

            "url": "https://www.theimpart.com/favicon.svg"
          }

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=4" />

    <script>
      (function() {
        try {
          var p = window.location.pathname;
          if (p === '/admin' || p === '/login') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            return;
          }
          var saved = localStorage.getItem('the_impart_theme_v1');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            // Темна тема є основною за замовчуванням
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-black dark:bg-[#222222] dark:text-[#cbcbcb] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
